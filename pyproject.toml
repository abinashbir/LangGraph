[project]
name = "lang-graph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abinashbir", email = "abinashbir13112.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "groq>=1.7.0",
    "langchain>=1.5.2",
    "langchain-gemini>=0.1.1",
    "langchain-google-genai>=4.5.2",
    "langchain-groq>=1.2.1",
    "langgraph>=1.2.24",
    "python-dotenv>=1.2.4",
]

[project.scripts]
lang-graph = "lang_graph:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
